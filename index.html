<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>ORCH - Agentic OS</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      /* Agent badge styles for provider status */
      .agent-badge {
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        font-family: var(--font-mono, monospace);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .agent-badge.ok { background: rgba(34, 197, 94, 0.18); color: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.3); }
      .agent-badge.err { background: rgba(239, 68, 68, 0.18); color: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.3); }
      .agent-badge.unknown { background: rgba(163, 163, 163, 0.15); color: #a3a3a3; }
      .glass-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text); border-radius: var(--radius-md); cursor: pointer; transition: all var(--anim-fast); }
      .glass-btn:hover { background: var(--glass-hover); }
      .glass-btn:active { background: var(--glass-active); }
      .no-drag { -webkit-app-region: no-drag; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
